<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title> Моя игра ✦</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Экран входа -->
    <div id="loginScreen" class="login-container">
        <div class="login-card">
            <h2>⚡ ВХОД ⚡</h2>
            <input type="email" id="loginEmail" placeholder="email">
            <input type="password" id="loginPassword" placeholder="пароль">
            <button id="loginBtn">ВОЙТИ</button>
            <div id="loginError" class="error-msg"></div>
        </div>
    </div>


    <!-- Контейнер игры -->
    <div id="gameContainer" class="game-container">
        <div class="container">
            <!-- Главная страница -->
            <div id="pageHome" class="page active">
                <!-- Верхняя статистика -->
                <div class="top-stats">
                    <div class="level-box">
                        <div class="level-label">УРОВЕНЬ</div>
                        <div class="level-value" id="globalLevel">1</div>
                        <div class="xp-text" id="globalXp">0 / 0 XP</div>
                    </div>
                    <div class="coins-box">
                        <div class="coins-label">МОНИТОРЫ</div>
                        <div class="coins-value" id="coinBalance">0</div>
                    </div>
                </div>


                <!-- Круговой прогресс (общий) -->
                <div class="circular-progress">
                    <svg width="140" height="140" viewBox="0 0 140 140">
                        <circle class="progress-ring-bg" cx="70" cy="70" r="60" fill="none" stroke="#1E2A4A" stroke-width="8"/>
                        <circle id="globalProgressRing" class="progress-ring-fill" cx="70" cy="70" r="60" fill="none" stroke="url(#progressGrad)" stroke-width="8" stroke-linecap="round" stroke-dasharray="377" stroke-dashoffset="377"/>
                        <text x="70" y="70" text-anchor="middle" dominant-baseline="middle" class="progress-text" id="globalProgressPercent">0%</text>
                        <text x="70" y="88" text-anchor="middle" dominant-baseline="middle" class="progress-label">прогресс</text>
                        <defs>
                            <linearGradient id="progressGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" stop-color="#2850A3"/>
                                <stop offset="100%" stop-color="#6B46C1"/>
                            </linearGradient>
                        </defs>
                    </svg>
                </div>


                <!-- Список навыков -->
                <div class="skills-list" id="skillsContainer"></div>


                <!-- Ежедневная цель -->
                <div class="daily-goal">
                    <div class="goal-title">ЕЖЕДНЕВНАЯ ЦЕЛЬ</div>
                    <div class="goal-progress" id="dailyGoalProgress">0 / 0</div>
                    <div class="goal-bar-bg">
                        <div class="goal-bar-fill" id="dailyGoalFill" style="width: 0%"></div>
                    </div>
                    <div class="goal-reward" id="dailyGoalReward">Выполни 3 задания и получи 50 монет</div>
                </div>


                <!-- Кнопка бонуса -->
                <button class="bonus-btn" id="dailyBonusBtn">ЗАБРАТЬ БОНУС</button>
            </div>


            <!-- КВЕСТЫ -->
            <div id="pageQuests" class="page">
                <h2>КВЕСТЫ</h2>
                <div class="filters">
                    <button class="filter-btn active" data-filter="all">ВСЕ</button>
                    <button class="filter-btn" data-filter="urgent">СРОЧНЫЕ</button>
                    <button class="filter-btn" data-filter="overdue">ПРОСРОЧЕННЫЕ</button>
                </div>
                <div id="questsContainer"></div>
            </div>


            <!-- НОВЫЙ КВЕСТ -->
            <div id="pageNewQuest" class="page">
                <h2>НОВЫЙ КВЕСТ</h2>
                <div class="form-group">
                    <label>название</label>
                    <input type="text" class="form-control" id="questName" placeholder="например: прочитать главу">
                </div>
                <div class="form-group">
                    <label>тип</label>
                    <select class="form-control" id="questType">
                        <option value="designerTheory">Дизайнер</option>
                        <option value="english">Английский</option>
                        <option value="style">Персональный стиль</option>
                        <option value="sport">Спорт</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>сложность</label>
                    <select class="form-control" id="questDifficulty">
                        <option value="20">★ Задача (20 XP)</option>
                        <option value="50">★★ Миссия (50 XP)</option>
                        <option value="100">★★★ Операция (100 XP)</option>
                        <option value="200">★★★★ Эпическая миссия (200 XP)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>сделать до (дата)</label>
                    <input type="date" class="form-control" id="questDate">
                </div>
                <button class="btn-neon" id="addQuestBtn">создать</button>
            </div>


            <!-- СТАТИСТИКА -->
            <div id="pageStats" class="page">
                <h2>СТАТИСТИКА</h2>
                <div class="stat-row"><span>всего XP</span> <span id="totalXP">0</span></div>
                <div class="stat-row"><span>выполнено квестов</span> <span id="doneCount">0</span></div>
                <div class="stat-row"><span>монет</span> <span id="statsCoins">0</span></div>
                <div class="stat-row"><span>дней подряд</span> <span id="statsStreak">0</span></div>
                <button class="reset-btn" id="resetProgressBtn">сбросить прогресс</button>
            </div>


            <!-- СПОРТ (ДЕРЕВО ЦЕЛЕЙ) — временно скрыто -->
            <div id="pageSport" class="page" style="display: none;">
                <canvas id="sportTreeCanvas" width="600" height="500"></canvas>
            </div>
        </div>


        <!-- МЕНЮ -->
        <div class="tab-bar">
            <div class="tab active" data-page="pageHome"><span>🏠</span>главная</div>
            <div class="tab" data-page="pageQuests"><span>📋</span>квесты</div>
            <div class="tab" data-page="pageNewQuest"><span>➕</span>новое</div>
            <div class="tab" data-page="pageStats"><span>📊</span>стат</div>
        </div>


        <!-- МОДАЛКА РЕДАКТИРОВАНИЯ -->
        <div class="edit-modal" id="editModal">
            <div class="edit-form">
                <h3>РЕДАКТИРОВАТЬ КВЕСТ</h3>
                <input type="text" id="editName" placeholder="название">
                <select id="editType">
                    <option value="designerTheory">Дизайнер</option>
                    <option value="english">Английский</option>
                    <option value="style">Стиль</option>
                    <option value="sport">Спорт</option>
                </select>
                <select id="editDifficulty">
                    <option value="20">★ Задача (20 XP)</option>
                    <option value="50">★★ Миссия (50 XP)</option>
                    <option value="100">★★★ Операция (100 XP)</option>
                    <option value="200">★★★★ Эпическая миссия (200 XP)</option>
                </select>
                <input type="date" id="editDate">
                <button class="btn-neon" id="saveEditBtn">сохранить</button>
            </div>
        </div>
    </div>


    <script type="module" src="firebase-config.js"></script>
    <script type="module" src="script.js"></script>
</body>
</html>
